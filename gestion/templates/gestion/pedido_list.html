{% extends "gestion/base.html" %}
{% block contenido %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Pedidos</h1>
    <a href="{% url 'pedido_crear' %}" class="btn btn-primary">+ Nuevo pedido</a>
  </div>
  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle mb-0">
        <thead class="table-dark">
          <tr><th>N°</th><th>Cliente</th><th>Fecha</th><th>Estado</th><th class="text-end"></th></tr>
        </thead>
        <tbody>
          {% for p in object_list %}
            <tr>
              <td>{{ p.pk }}</td><td>{{ p.cliente.nombre }}</td><td>{{ p.fecha }}</td>
              <td><span class="badge text-bg-{{ p.color_estado }}">{{ p.get_estado_display }}</span></td>
              <td class="text-end">
                <a href="{% url 'pedido_detalle' p.pk %}" class="btn btn-sm btn-outline-primary">Ver</a>
              </td>
            </tr>
          {% empty %}
            <tr><td colspan="5" class="text-center text-muted py-4">No hay pedidos registrados.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
{% endblock %}
