{% extends "gestion/base.html" %}
{% block contenido %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">Clientes</h1>
    <a href="{% url 'cliente_crear' %}" class="btn btn-primary">+ Nuevo cliente</a>
  </div>
  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle mb-0">
        <thead class="table-dark">
          <tr><th>CID</th><th>Nombre</th><th>CI/RUC</th><th>Teléfono</th><th class="text-end">Acciones</th></tr>
        </thead>
        <tbody>
          {% for c in object_list %}
            <tr>
              <td>{{ c.cid }}</td><td>{{ c.nombre }}</td>
              <td>{{ c.ci_ruc }}</td><td>{{ c.telefono }}</td>
              <td class="text-end">
                <a href="{% url 'cliente_editar' c.pk %}" class="btn btn-sm btn-outline-primary">Editar</a>
                <a href="{% url 'cliente_borrar' c.pk %}" class="btn btn-sm btn-outline-danger">Eliminar</a>
              </td>
            </tr>
          {% empty %}
            <tr><td colspan="5" class="text-center text-muted py-4">No hay clientes cargados.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
{% endblock %}
